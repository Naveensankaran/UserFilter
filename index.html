<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assign Enquiry - Role Restricted Owner</title>

  <!-- Zoho CRM Widget SDK -->
  <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #333;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }
    select {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #d3d3d3;
      border-radius: 6px;
      background: #fff;
      margin-bottom: 16px;
    }
    select:disabled {
      background: #f5f5f5;
      color: #999;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    button {
      padding: 9px 20px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #submitBtn {
      background: #1a73e8;
      color: #fff;
    }
    #submitBtn:disabled {
      background: #a9c7f5;
      cursor: not-allowed;
    }
    #cancelBtn {
      background: #eee;
      color: #333;
    }
    .status {
      font-size: 13px;
      color: #777;
      margin-bottom: 12px;
      min-height: 18px;
    }
    .error {
      color: #d93025;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status" id="statusMsg">Loading Direct Sales Executives...</div>

    <label for="ownerSelect">Lead Owner (Direct Sales Executive)</label>
    <select id="ownerSelect" disabled>
      <option value="">-- Select --</option>
    </select>

    <div class="btn-row">
      <button id="cancelBtn" type="button">Cancel</button>
      <button id="submitBtn" type="button" disabled>Save</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
